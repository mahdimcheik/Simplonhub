name: Deploy Develop API

on:
  push:
    branches:
      - main
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          
      - name: Build Docker image
        run: docker build -t mahdimcheik/simplon-hub-api:latest ./SimplonHubApi

      - name: Push image to Docker Hub
        run: docker push mahdimcheik/simplon-hub-api:latest

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            docker pull mahdimcheik/simplon-hub-api:latest
            docker compose -f /home/mahdi/simplon-hub/back-end/docker-compose.yml up -d --force-recreate
